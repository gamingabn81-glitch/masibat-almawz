
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>مصيبة في عالم الموز 🍌</title>

    <link rel="stylesheet" href="./style.css">

    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js"
        }
    }
    </script>
</head>

<body>

    <div id="hud">
        <b>🍌 مصيبة في عالم الموز</b>
        <div>الفصل الأول: القرية المجنونة</div>
        <div>الموز: <span id="score">0</span> / 3</div>
        <div id="mission">المهمة: اجمع الموز!</div>
    </div>

    <div id="dialog"></div>

    <div id="controls">
        WASD أو الأسهم: الحركة<br>
        Shift: الركض<br>
        E: التحدث والتفاعل
    </div>

    <div id="cross">+</div>

    <div id="start">
        <div class="start-content">
            <div class="logo">🍌🤠</div>
            <h1>مصيبة في عالم الموز</h1>
            <p>مغامرة كوميدية ثلاثية الأبعاد</p>
            <button id="play">ابدأ المغامرة</button>
            <p class="hint">استخدم لوحة المفاتيح للتحرك</p>
        </div>
    </div>

    <script type="module" src="./src/main.js"></script>

</body>
</html>
